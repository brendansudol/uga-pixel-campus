<title>UGA Pixel Campus</title>
<meta name="description" content="A looping pixel-art diorama of the University of Georgia's North Campus with synthesized sound: the Arch, Uga, the Chapel Bell, and a Redcoat trumpeter playing Glory, Glory.">

<style>
/* Layout: one square pixel diorama on its own sky; a caption and two pixel buttons sit under it */
:root{
  --page:#7f90dc;
  --ink:#1f1d2e;
  --paper:#fbfaff;
  --red:#ba0c2f;
  --shadow:#5d6bb8;
  --font-pixel:"Silkscreen", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
html,body{height:100%}
body{
  margin:0;background:var(--page);color:var(--ink);
  font-family:var(--font-pixel);
  display:flex;align-items:center;justify-content:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px;box-sizing:border-box;
}
.stage{display:flex;flex-direction:column;gap:12px;align-items:stretch;max-width:100%}
.frame{position:relative;line-height:0;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--shadow);background:var(--ink);max-width:100%}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%;height:auto;cursor:pointer}
.hint{
  position:absolute;left:10px;top:10px;
  font:inherit;font-size:12px;line-height:1;letter-spacing:.04em;text-transform:uppercase;
  background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  padding:7px 9px 6px;cursor:pointer;
  animation:nudge 1.2s steps(2) infinite;
}
@keyframes nudge{50%{transform:translateY(-2px)}}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.cap{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.cap b{font-weight:400;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.cap span{font-size:11px;letter-spacing:.03em;opacity:.85}
.ctrls{display:flex;gap:10px}
.ctrls button{
  font:inherit;font-size:12px;line-height:1;letter-spacing:.05em;text-transform:uppercase;
  background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  padding:8px 10px 7px;cursor:pointer;min-width:92px;
}
.ctrls button[aria-pressed="true"]{background:var(--red);color:var(--paper)}
.ctrls button:active,.hint:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
[hidden]{display:none!important}
button:focus-visible,canvas:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
@media (prefers-reduced-motion: reduce){.hint{animation:none}}
</style>
</head>
<body>
<main class="stage">
  <div class="frame" id="frame">
    <canvas id="scene" width="240" height="240" tabindex="0" aria-label="Animated pixel-art scene of the University of Georgia's North Campus: a freshman walks around the Arch, Uga naps by his doghouse until a squirrel runs past, the Chapel Bell rings on the roof, and a Redcoat trumpeter plays Glory Glory while a graduate walks through the Arch."></canvas>
    <button class="hint" id="hint" type="button">Click for sound</button>
  </div>
  <div class="bar">
    <p class="cap"><b>North Campus &middot; Athens, GA</b><span>Freshmen walk around the Arch. Graduates walk through it.</span></p>
    <div class="ctrls">
      <button id="snd" type="button" aria-pressed="false">Sound off</button>
      <button id="pp" type="button" aria-pressed="false">Pause</button>
    </div>
  </div>
</main>

// ---------- helpers ----------
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h);}
function P(x,y,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),1,1);}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function dk(hex,f){f=f||0.78;const n=parseInt(hex.slice(1),16);const r=Math.round((n>>16&255)*f),gg=Math.round((n>>8&255)*f),b=Math.round((n&255)*f);return '#'+((1<<24)|(r<<16)|(gg<<8)|b).toString(16).slice(1);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function line(x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1;let e=dx+dy;for(;;){P(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function clip(x,y,w,h,fn){g.save();g.beginPath();g.rect(x,y,w,h);g.clip();fn();g.restore();}
function disc(x,y,r,c){for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(dx*dx+dy*dy<=r*r+r*0.6)P(x+dx,y+dy,c);}

// sprites: rows of chars, map char -> color
const sprCache=new Map();
function mk(rows,map){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const c=mkCanvas(w,h),x=c.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<rows[j].length;i++){const col=map[rows[j][i]];if(col){x.fillStyle=col;x.fillRect(i,j,1,1);}}
  return c;
}
function spr(key,rows,map,flip){
  const k=key+(flip?'|f':'');let c=sprCache.get(k);
  if(!c){c=mk(rows,map);if(flip){const f=mkCanvas(c.width,c.height),fx=f.getContext('2d');fx.translate(c.width,0);fx.scale(-1,1);fx.drawImage(c,0,0);c=f;}sprCache.set(k,c);}
  return c;
}
function D(key,rows,map,x,y,flip){g.drawImage(spr(key,rows,map,flip),Math.round(x),Math.round(y));}

'!':'# # # . #',"'":'# # . . .','.':'. . . . #','-':'... ... ### ... ...',' ':'.. .. .. .. ..'};

function txt(s,x,y,col){g.fillStyle=col;let cx=Math.round(x);y=Math.round(y);for(const ch of s){const gl=FONT[ch]||FONT[' '];for(let r=0;r<5;r++)for(let i=0;i<gl[r].length;i++)if(gl[r][i]==='#')g.fillRect(cx+i,y+r,1,1);cx+=gl[0].length+1;}}
function txtO(s,x,y,col,ol){for(const d of [[-1,0],[1,0],[0,-1],[0,1],[1,1]])txt(s,x+d[0],y+d[1],ol);txt(s,x,y,col);}

// ---------- static layer ----------
function texture(x,y,w,h,cols,density,seed){const r=rng(seed);const n=Math.floor(w*h*density);for(let i=0;i<n;i++){const px=x+Math.floor(r()*(w-3)),py=y+Math.floor(r()*h);R(px,py,r()<0.5?2:3,1,cols[Math.floor(r()*cols.length)]);}}

function drawTree(){
  const r=rng(11);
  R(17,136,6,70,K.trunk);R(21,136,2,70,K.trunkD);R(15,202,10,4,K.trunk);R(13,204,14,2,K.trunk);R(22,202,3,4,K.trunkD);
  for(let i=0;i<16;i++){P(17-i*0.8,137-i,K.trunk);P(18-i*0.8,137-i,K.trunk);}
  for(let i=0;i<14;i++){P(22+i*0.9,139-i,K.trunk);P(23+i*0.9,139-i,K.trunkD);}
  const cx=18,cy=116;
  const pass=(n,rx,ry,ox,oy,rmin,rmax,col)=>{for(let i=0;i<n;i++){const a=r()*Math.PI*2,d=Math.sqrt(r());disc(Math.round(cx+ox+Math.cos(a)*d*rx),Math.round(cy+oy+Math.sin(a)*d*ry),Math.round(rmin+r()*(rmax-rmin)),col);}};

}

// ---------- particles ----------
const parts=[];const groundLeaves=[];
function spawn(p){p.age=0;parts.push(p);}
function spawnLeaf(x,y,fast){spawn({type:'leaf',x,y,vx:fast?18+Math.random()*14:1.5+Math.random()*3.5,vy:fast?4+Math.random()*4:8+Math.random()*5,ph:Math.random()*6,c:[K.leaf1,K.leaf2,K.leaf3,K.leaf4][Math.floor(Math.random()*4)],land:G+1+Math.floor(Math.random()*6)});}
function updateParticles(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.age+=dt;
    if(p.type==='leaf'){p.x+=p.vx*dt+Math.sin(p.age*3+p.ph)*0.35;p.y+=p.vy*dt;
      if(p.y>=p.land){if(p.x>-2&&p.x<W){groundLeaves.push({x:Math.round(p.x),y:p.land,c:p.c,w:Math.random()<0.5?2:1});if(groundLeaves.length>36)groundLeaves.shift();}parts.splice(i,1);continue;}
      if(p.x>W+4){parts.splice(i,1);continue;}continue;}
    p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;
    if(p.type==='note'||p.type==='z')p.x+=Math.sin(p.age*5+(p.ph||0))*0.3;
    if(p.type==='drop'&&p.y>=121){parts.splice(i,1);spawn({type:'splash',x:p.x,y:120,life:0.25});continue;}
    if(p.life&&p.age>=p.life)parts.splice(i,1);
  }
}
const Z_BIG=['####','...#','..#.','.#..','####'],Z_SM=['###','..#','.#.','###'];
function drawParts(){
  for(const p of parts){
    const x=Math.round(p.x),y=Math.round(p.y);
    switch(p.type){
      case 'leaf':{const f=Math.floor(p.age*5+p.ph)%2;if(f)R(x,y,2,1,p.c);else R(x,y,1,2,p.c);break;}
      case 'smoke':{const k=p.age/p.life;if(k>0.92)break;const s=k<0.25?1:(k<0.6?2:3);R(x,y,s,s,k<0.45?'#ebeaf4':'#c9cde0');break;}
      case 'z':{const rows=p.age>0.8?Z_BIG:Z_SM;for(let j=0;j<rows.length;j++)for(let i=0;i<rows[j].length;i++)if(rows[j][i]==='#'){P(x+i,y+j+1,K.ink);}for(let j=0;j<rows.length;j++)for(let i=0;i<rows[j].length;i++)if(rows[j][i]==='#')P(x+i,y+j,K.paper);break;}
      case 'note':{if(p.age>p.life-0.25&&Math.floor(p.age*12)%2)break;for(let j=0;j<5;j++)for(let i=0;i<4;i++)if(NOTE[j][i]==='#'){P(x+i+1,y+j+1,K.ink);}for(let j=0;j<5;j++)for(let i=0;i<4;i++)if(NOTE[j][i]==='#')P(x+i,y+j,p.c||K.paper);break;}
      case 'letter':{if(p.age>p.life-0.3&&Math.floor(p.age*12)%2)break;txtO(p.ch,x,y,K.red,K.paper);break;}
      case 'spark':{const c=p.c||K.goldL;P(x,y,c);if(p.age<p.life*0.5){P(x-1,y,c);P(x+1,y,c);P(x,y-1,c);P(x,y+1,c);}break;}
      case 'ring':{const r=8+p.age*26;for(const side of [-1,1])for(let k=-3;k<=3;k++){const a=k*0.17;P(p.x+side*Math.cos(a)*r,p.y+Math.sin(a)*r,K.paper);}break;}
      case 'dong':{if(p.age>p.life-0.3&&Math.floor(p.age*12)%2)break;txtO('DONG',x,y,K.paper,K.ink);break;}
      case 'drop':P(x,y,'#bfe3ff');break;
      case 'splash':P(x-1,y,'#bfe3ff');P(x+1,y-1,'#bfe3ff');break;
      case 'steam':{if(p.age<p.life)R(x,y,p.age>0.5?2:1,1,'#ffffff');break;}
    }
  }
}

  snort(){noise({dur:0.18,freq:600,q:3,gain:0.1,pan:0.55});},
  bark(){const ac=A.ctx,w=now();const o=ac.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(300,w);o.frequency.linearRampToValueAtTime(500,w+0.03);o.frequency.exponentialRampToValueAtTime(180,w+0.17);
    const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(950,w);f.frequency.exponentialRampToValueAtTime(480,w+0.17);f.Q.value=1.3;
    const gn=ac.createGain();gn.gain.setValueAtTime(0.0001,w);gn.gain.exponentialRampToValueAtTime(0.42,w+0.015);gn.gain.exponentialRampToValueAtTime(0.0001,w+0.19);
    o.connect(f);f.connect(gn);gn.connect(out(0.55));o.start(w);o.stop(w+0.22);noise({when:w,dur:0.09,freq:1400,q:0.7,gain:0.14,pan:0.55});},
  sigh(){noise({dur:0.9,type:'lowpass',freq:900,freqEnd:280,gain:0.04,attack:0.15,pan:0.55});},
  snore(){const ac=A.ctx,w=now();const s=ac.createBufferSource();s.buffer=A.noise;s.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=420;
    const am=ac.createGain();am.gain.value=0.6;const lfo=ac.createOscillator();lfo.frequency.value=27;const lg=ac.createGain();lg.gain.value=0.4;lfo.connect(lg);lg.connect(am.gain);
    const gn=ac.createGain();gn.gain.setValueAtTime(0.0001,w);gn.gain.exponentialRampToValueAtTime(0.05,w+0.6);gn.gain.exponentialRampToValueAtTime(0.0001,w+1.1);
    s.connect(f);f.connect(am);am.connect(gn);gn.connect(out(0.55));s.start(w);s.stop(w+1.2);lfo.start(w);lfo.stop(w+1.2);
    noise({when:w+1.2,dur:0.7,freq:650,q:0.6,gain:0.018,attack:0.2,pan:0.55});},
  rustle(){const w=now();for(let i=0;i<10;i++)noise({when:w+i*0.05+Math.random()*0.03,dur:0.06,type:'highpass',freq:2500,gain:0.03,pan:-0.8});},
  bell(){const w=now(),b=196;for(const [r,a,d] of [[0.5,0.35,4.5],[1,0.5,3.5],[1.2,0.3,2.5],[1.5,0.22,2.2],[2,0.3,2.0],[2.5,0.12,1.4],[3,0.1,1.1],[4.1,0.06,0.8],[5.4,0.04,0.5]])tone({when:w,freq:b*r,dur:d,gain:a*0.15,attack:0.004,pan:-0.2});noise({when:w,dur:0.05,freq:3000,q:0.8,gain:0.06,pan:-0.2});},
  flap(){const w=now();for(let i=0;i<7;i++)noise({when:w+i*0.07,dur:0.04,freq:1200,q:0.8,gain:0.04,pan:-0.15});},
  coo(){const w=now();for(let i=0;i<2;i++)tone({when:w+i*0.35,freq:430,freqEnd:360,dur:0.28,gain:0.03,attack:0.05,pan:-0.2,type:'triangle'});},
  car(){const ac=A.ctx,w=now(),dur=1.9;const p=ac.createStereoPanner?ac.createStereoPanner():ac.createGain();if(p.pan){p.pan.setValueAtTime(0.9,w);p.pan.linearRampToValueAtTime(-0.9,w+dur);}p.connect(A.master);
    const s=ac.createBufferSource();s.buffer=A.noise;s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=650;f.Q.value=0.6;const gn=ac.createGain();gn.gain.setValueAtTime(0.0001,w);gn.gain.exponentialRampToValueAtTime(0.1,w+dur*0.5);gn.gain.exponentialRampToValueAtTime(0.0001,w+dur);s.connect(f);f.connect(gn);gn.connect(p);s.start(w);s.stop(w+dur);
    const o=ac.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(72,w);o.frequency.linearRampToValueAtTime(60,w+dur);const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=280;const g2=ac.createGain();g2.gain.setValueAtTime(0.0001,w);g2.gain.exponentialRampToValueAtTime(0.07,w+dur*0.5);g2.gain.exponentialRampToValueAtTime(0.0001,w+dur);o.connect(lp);lp.connect(g2);g2.connect(p);o.start(w);o.stop(w+dur);},
  shh(){noise({dur:0.6,type:'highpass',freq:3800,gain:0.04,attack:0.06,pan:0.25});},
  chime(){const w=now();[82,86,89,94].forEach((m,i)=>tone({when:w+i*0.08,type:'triangle',freq:mtof(m),dur:0.7,gain:0.025,pan:-0.7}));},
  hiss(){const w=now();noise({when:w,dur:1.0,freq:3000,q:0.5,gain:0.05,attack:0.15,pan:0.35});tone({when:w+0.1,freq:140,dur:0.8,gain:0.015,pan:0.35,type:'triangle'});},
  plip(){tone({freq:1800,freqEnd:900,dur:0.05,gain:0.012,pan:0.4});},
  guitar(){const w=now();G_CHORDS.forEach((ch,ci)=>ch.forEach((m,i)=>pluck(w+(ci*8+i)*G_STEP,m,i===0?0.16:0.11,-0.12)));},
  trumpet(){const w=now();
    for(const n of TR_NOTES)trumpetNote(w+(n.start-TR_START),n.m,n.dur);
    for(let i=0;i<16;i++){const tt=w+i*0.375;const acc=i%2===0;noise({when:tt,dur:0.09,type:'highpass',freq:1800,gain:acc?0.05:0.03,pan:-0.28});if(acc)tone({when:tt,freq:110,freqEnd:45,dur:0.2,gain:0.16,pan:-0.28});}
    for(let i=0;i<6;i++)noise({when:w+5.25+i*0.06,dur:0.05,type:'highpass',freq:1800,gain:0.035,pan:-0.28});},
};

// timeline events: [time, visualFn, soundFn]
const EVENTS=[];
function ev(t,vis,snd){EVENTS.push({t,vis,snd});}
for(let s=0.35;s<1.4;s+=0.27)ev(s,null,()=>SFX.step(freshState(s)?.x||0));
for(let s=2.65;s<7.9;s+=0.27)ev(s,null,()=>SFX.step(freshState(s)?.x||30));
ev(1.55,null,()=>SFX.blip(4));
ev(2.8,null,()=>SFX.guitar());
ev(3.6,()=>{for(let i=0;i<7;i++)spawnLeaf(4+Math.random()*30,110+Math.random()*28,true);},()=>SFX.gust());
ev(5.55,()=>{for(let i=0;i<6;i++)spawn({type:'smoke',x:123+Math.random()*4,y:44,vx:1+Math.random()*2,vy:-8-Math.random()*4,life:2.2});},()=>SFX.sizzle());
ev(7.9,null,()=>SFX.creak());ev(8.5,null,()=>SFX.thunk());
ev(8.8,null,()=>SFX.alarm());ev(10.05,null,()=>SFX.slap());
ev(10.1,null,()=>SFX.chitter(230));ev(10.6,null,()=>SFX.snort());
for(const b of [11.0,11.4,11.8])ev(b,null,()=>SFX.bark());
ev(12.0,null,()=>SFX.car());ev(13.2,null,()=>SFX.sigh());
ev(15.2,()=>{for(let i=0;i<10;i++)spawnLeaf(8+Math.random()*24,128+Math.random()*14,Math.random()<0.4);},()=>{SFX.rustle();SFX.chitter(20);});
for(const d of [15.825,16.725,17.625])ev(d,()=>{spawn({type:'ring',x:96,y:44,life:0.6});spawn({type:'dong',x:63,y:36,vy:-6,life:0.9});},()=>SFX.bell());
ev(15.85,null,()=>SFX.flap());ev(23.0,null,()=>SFX.flap());ev(24.3,null,()=>SFX.coo());
ev(18.35,null,()=>SFX.creak());ev(19.2,null,()=>SFX.thunk());
ev(TR_START,null,()=>SFX.trumpet());
TR_NOTES.forEach(n=>ev(n.start,()=>{if(n.letter){const i='GEORGIA'.length-(TR_NOTES.length-TR_NOTES.indexOf(n));spawn({type:'letter',ch:n.letter,x:68+i*6,y:88,vx:0,vy:-1.6,life:4.2-i*0.3});}else spawn({type:'note',x:96,y:99,vx:4+Math.random()*3,vy:-6-Math.random()*3,ph:Math.random()*6,life:1.8,c:K.gold});},null));
ev(20.6,null,()=>SFX.shh());
ev(22.0,null,()=>SFX.chime());
ev(24.9,()=>{for(let i=0;i<8;i++)spawn({type:'steam',x:162+Math.random()*5,y:186,vx:Math.random()*2-1,vy:-9-Math.random()*4,life:0.9});},()=>SFX.hiss());
for(const s of [1.0,4.2,7.4,14.6,25.2])ev(s,null,()=>SFX.snore());

// continuous spawners
const timers={leaf:0,smoke:0,zu:0,zs:0,gnote:0,drip:0,spark:0};
function spawners(dt,t){
  timers.leaf-=dt;if(timers.leaf<=0){timers.leaf=0.7+Math.random()*0.9;spawnLeaf(-2+Math.random()*44,104+Math.random()*34,false);}
  timers.smoke-=dt;if(timers.smoke<=0){timers.smoke=0.3;spawn({type:'smoke',x:122+Math.random()*5,y:44,vx:1.5+Math.random()*1.5,vy:-5-Math.random()*2,life:3.2});}
  const ugaAsleep=!(t>=10.6&&t<13.2);
  timers.zu-=dt;if(timers.zu<=0){timers.zu=1.8;if(ugaAsleep)spawn({type:'z',x:189,y:197,vx:-2,vy:-5,ph:Math.random()*6,life:2.0});}
  const sleeperAsleep=!(t>=8.8&&t<10.8);
  timers.zs-=dt;if(timers.zs<=0){timers.zs=1.6;if(sleeperAsleep)spawn({type:'z',x:111,y:95,vx:2,vy:-4,ph:Math.random()*6,life:1.3});}
  timers.gnote-=dt;if(timers.gnote<=0){timers.gnote=0.7;if(t>=GUITAR_START&&t<GUITAR_START+G_STEP*32)spawn({type:'note',x:106,y:70,vx:3,vy:-6,ph:Math.random()*6,life:1.4,c:K.paper});}
  timers.drip-=dt;if(timers.drip<=0){timers.drip=3.2;spawn({type:'drop',x:170,y:112,vy:22,life:2});}
  const gs=gradState(t);timers.spark-=dt;if(gs&&gs.x>8&&gs.x<40&&timers.spark<=0){timers.spark=0.12;spawn({type:'spark',x:gs.x+Math.random()*10-1,y:gs.y-16+Math.random()*12,life:0.45,c:Math.random()<0.5?K.goldL:K.paper});}
}

// ---------- clock ----------
let T=0;
function fire(prev,cur){
  const wrapped=cur<prev;
  for(const e of EVENTS){
    const hit=wrapped?(e.t>prev||e.t<=cur):(e.t>prev&&e.t<=cur);
    if(!hit)continue;
    if(e.vis)e.vis();
    if(e.snd&&A.on){try{e.snd();}catch(err){}}
  }
}
function updatePlaneDrone(t){if(!A.on||!A.drone)return;const px=-120+t*(480/LOOP)+7;const k=Math.max(0,1-Math.abs(px-120)/200);const n=A.ctx.currentTime;A.drone.g.gain.setTargetAtTime(0.022*k*k,n,0.2);if(A.drone.p.pan)A.drone.p.pan.setTargetAtTime(pan(px),n,0.2);}
function step(dt){
  const prev=T%LOOP;T+=dt;const cur=T%LOOP;
  fire(prev,cur);spawners(dt,cur);updateParticles(dt);
  if(A.on){updatePlaneDrone(cur);if(Math.random()<dt/4.5)chirp();}
}
function chirp(){const w=now(),p=Math.random()*1.6-0.8;const n=2+Math.floor(Math.random()*3),f=3200+Math.random()*1400;for(let i=0;i<n;i++)tone({when:w+i*0.09,freq:f,freqEnd:f*1.3,dur:0.06,gain:0.012,attack:0.004,pan:p});}

function startAmbience(){
  const ac=A.ctx;
  const s=ac.createBufferSource();s.buffer=A.noise;s.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=380;
  const gn=ac.createGain();gn.gain.value=0.03;const lfo=ac.createOscillator();lfo.frequency.value=0.09;const lg=ac.createGain();lg.gain.value=0.018;lfo.connect(lg);lg.connect(gn.gain);
  s.connect(f);f.connect(gn);gn.connect(A.master);s.start();lfo.start();
  const o1=ac.createOscillator(),o2=ac.createOscillator();o1.type='sawtooth';o2.type='sawtooth';o1.frequency.value=86;o2.frequency.value=88.5;
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;const dg=ac.createGain();dg.gain.value=0;const dp=ac.createStereoPanner?ac.createStereoPanner():ac.createGain();
  o1.connect(lp);o2.connect(lp);lp.connect(dg);dg.connect(dp);dp.connect(A.master);o1.start();o2.start();
  A.drone={g:dg,p:dp};
}
function initAudio(){
  if(A.ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const ac=new AC();A.ctx=ac;
  A.master=ac.createGain();A.master.gain.value=1.7;
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.attack.value=0.005;comp.release.value=0.2;
  A.master.connect(comp);comp.connect(ac.destination);
  const len=ac.sampleRate*2,nb=ac.createBuffer(1,len,ac.sampleRate),d=nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;A.noise=nb;
  startAmbience();
}

// ---------- UI ----------
const hint=document.getElementById('hint'),sndBtn=document.getElementById('snd'),ppBtn=document.getElementById('pp');
let playing=true;
function setSound(on){
  if(on){initAudio();if(!A.ctx)return;A.ctx.resume();A.on=true;if(!playing)A.ctx.suspend();}
  else{A.on=false;if(A.ctx)A.ctx.suspend();}
  sndBtn.textContent=on?'Sound on':'Sound off';sndBtn.setAttribute('aria-pressed',on?'true':'false');
  hint.hidden=true;
}
function setPlaying(p){
  playing=p;ppBtn.textContent=p?'Pause':'Play';ppBtn.setAttribute('aria-pressed',p?'false':'true');
  if(A.ctx&&A.on){p?A.ctx.resume():A.ctx.suspend();}
  last=null;acc=0;
}
hint.addEventListener('click',e=>{e.stopPropagation();setSound(true);});
sndBtn.addEventListener('click',()=>setSound(!A.on));
ppBtn.addEventListener('click',()=>setPlaying(!playing));
cv.addEventListener('click',()=>{if(!A.on)setSound(true);else setPlaying(!playing);});
cv.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();setPlaying(!playing);}});
document.addEventListener('visibilitychange',()=>{if(!A.ctx||!A.on)return;if(document.hidden)A.ctx.suspend();else if(playing)A.ctx.resume();});

function fit(){
  const availW=Math.min(window.innerWidth-40,1200),availH=window.innerHeight-130;
  const m=Math.max(160,Math.min(availW,availH));let s=Math.floor(m/W);
  const size=s>=2?s*W:Math.min(availW,Math.max(W,m));
  cv.style.width=size+'px';
  // the stage follows the canvas so a long caption wraps instead of widening the frame
  document.querySelector('.stage').style.width=(size+8)+'px';
}
window.addEventListener('resize',fit);

let last=null,acc=0;
function tick(nowMs){
  if(last===null)last=nowMs;
  let dt=(nowMs-last)/1000;last=nowMs;if(dt>0.25)dt=0.25;
  if(playing){acc+=dt;let stepped=false;while(acc>=1/FPS){acc-=1/FPS;step(1/FPS);stepped=true;}if(stepped)render();}
  requestAnimationFrame(tick);
}

function resetSim(){parts.length=0;groundLeaves.length=0;T=0;for(const k in timers)timers[k]=0;}
function simulateTo(tt){resetSim();const n=Math.round(tt*FPS);for(let i=0;i<n;i++)step(1/FPS);}

buildAll();
{
  fit();
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  simulateTo(0);render();
  if(reduce){simulateTo(16.1);render();setPlaying(false);}
  requestAnimationFrame(tick);
}
</script>
</body>
